[package]
name = "metrics-kit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
metrics-kit = { path = ".." }

[[bin]]
name = "fuzz_registry"
path = "fuzz_targets/fuzz_registry.rs"
test = false
doc = false

[[bin]]
name = "fuzz_render_numbers"
path = "fuzz_targets/fuzz_render_numbers.rs"
test = false
doc = false
