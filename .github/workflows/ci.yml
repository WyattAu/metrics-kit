name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: WyattAu/engineering-standards/.github/workflows/rust-kit.yml@e344f4c65bcdb6df979c557e25e351626b3cf7f9
    with:
      tier: a
      all-features: true

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Criterion smoke (sanity, not a gate)
        run: cargo bench -- --test

  # Fuzz smoke: 60s per registry/exposition target. Full runs are
  # local/nightly; this gate catches regressions on adversarial
  # name/label/value inputs early.
  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - name: registry smoke (60s)
        run: cargo fuzz run fuzz_registry -- -max_total_time=60 -max_len=4096 -detect_leaks=0
      - name: render numbers smoke (60s)
        run: cargo fuzz run fuzz_render_numbers -- -max_total_time=60 -max_len=4096 -detect_leaks=0
