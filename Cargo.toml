[package]
name = "metrics-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Lock-free Prometheus-exposition metrics kit — counters, gauges, histograms with cache-line padding, cardinality guards, and VictoriaMetrics/Grafana-compatible text output"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/metrics-kit"
keywords = ["metrics", "prometheus", "observability", "victoriametrics", "monitoring"]
categories = ["development-tools::profiling"]
exclude = [".github/", "benches/"]

[features]
default = []
axum = ["dep:axum"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }

[dev-dependencies]
criterion = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[[bench]]
name = "registry_bench"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.layers]
tier = "L1"
